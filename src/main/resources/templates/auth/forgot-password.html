<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::.container})}">
<head>
    <title>Забыли пароль - Foodboxd</title>
</head>
<body>
<div class="container" th:fragment="content">
    <div class="card auth-card">
        <span class="auth-icon"><i class="fas fa-key"></i></span>
        <h2>Восстановление пароля</h2>
        <div th:if="${success}" class="success-message" th:text="${success}"></div>
        <div th:if="${error}" class="error-message" th:text="${error}"></div>
        <form th:action="@{/forgot-password}" method="post">
            <div class="form-group">
                <label>Введите ваш email</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>
            <button type="submit" class="btn">Отправить</button>
        </form>
        <p class="auth-footer">
            <a th:href="@{/login}"><i class="fas fa-arrow-left"></i> Вернуться ко входу</a>
        </p>
    </div>
</div>
</body>
</html>
