<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::.container})}">
<head>
    <title>Новый пароль - Foodboxd</title>
</head>
<body>
<div class="container" th:fragment="content">
    <div class="card auth-card">
        <span class="auth-icon"><i class="fas fa-lock"></i></span>
        <h2>Установите новый пароль</h2>
        <div th:if="${error}" class="error-message" th:text="${error}"></div>
        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <div class="form-group">
                <label>Новый пароль (минимум 6 символов)</label>
                <input type="password" name="password" placeholder="••••••••" required minlength="6">
            </div>
            <button type="submit" class="btn">Сохранить</button>
        </form>
        <p class="auth-footer">
            <a th:href="@{/login}"><i class="fas fa-arrow-left"></i> Вернуться ко входу</a>
        </p>
    </div>
</div>
</body>
</html>
