<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::.container})}">
<head>
    <title>Регистрация - Foodboxd</title>
</head>
<body>
<div class="container" th:fragment="content">
    <div class="card" style="max-width: 400px; margin: 2rem auto;">
        <h2>Регистрация</h2>
        <form th:action="@{/register}" th:object="${user}" method="post">
            <div th:if="${error}"><p style="color:red" th:text="${error}"></p></div>
            <div class="form-group">
                <label>Никнейм: <input type="text" th:field="*{username}" required></label>
            </div>
            <div class="form-group">
                <label>Email: <input type="email" th:field="*{email}" required></label>
            </div>
            <div class="form-group">
                <label>Пароль: <input type="password" th:field="*{password}" required></label>
            </div>
            <button type="submit" class="btn">Зарегистрироваться</button>
        </form>
    </div>
</div>
</body>
</html>
