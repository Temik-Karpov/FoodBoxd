<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::.container})}">
<head>
    <title>Регистрация - Foodboxd</title>
</head>
<body>
<div class="container" th:fragment="content">
    <div class="card auth-card">
        <span class="auth-icon"><i class="fas fa-user-plus"></i></span>
        <h2>Регистрация</h2>
        <form th:action="@{/register}" th:object="${user}" method="post">
            <div th:if="${error}"><p class="error-message" th:text="${error}"></p></div>
            <div class="form-group">
                <label>Никнейм</label>
                <input type="text" th:field="*{username}" placeholder="Как вас зовут?" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" th:field="*{password}" placeholder="Минимум 6 символов" required>
            </div>
            <button type="submit" class="btn">Зарегистрироваться</button>
        </form>
        <p class="auth-footer">
            Уже есть аккаунт? <a th:href="@{/login}">Войти</a>
        </p>
    </div>
</div>
</body>
</html>
