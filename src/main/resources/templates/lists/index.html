<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::.container})}">
<head>
    <title>Мои списки - Foodboxd</title>
</head>
<body>
<div class="container" th:fragment="content">
    <div class="admin-bar">
        <h2 style="margin: 0; flex: 1;">Мои списки</h2>
        <a th:href="@{/lists/create}" class="btn btn-sm">
            <i class="fas fa-plus"></i> Создать список
        </a>
    </div>

    <div th:if="${lists.isEmpty()}" class="card">
        <p class="empty-state">
            <i class="fas fa-list"></i>
            У вас пока нет списков. Создайте первый!
        </p>
    </div>

    <div class="lists-grid" th:if="${!lists.isEmpty()}">
        <a th:each="list : ${lists}"
           th:href="@{'/lists/' + ${list.id}}"
           class="card list-card">
            <div class="list-card-body">
                <h3 th:text="${list.name}"></h3>
                <p class="list-card-desc" th:if="${list.description}" th:text="${list.description}"></p>
                <div class="list-card-meta">
                    <span class="list-badge"
                          th:classappend="${list.isPublic} ? 'badge-public' : 'badge-private'"
                          th:text="${list.isPublic} ? 'Публичный' : 'Приватный'"></span>
                    <span class="list-count">
                        <i class="fas fa-th-list"></i>
                        <span th:text="${#lists.size(list.items)}"></span>
                    </span>
                    <span class="list-type"
                          th:if="${list.itemType != null}"
                          th:text="${list.itemType.name() == 'RESTAURANT'} ? 'Заведения' : 'Блюда и напитки'"></span>
                </div>
                <span class="list-created" th:if="${list.createdAt != null}"
                      th:text="'Создан ' + ${#temporals.format(list.createdAt, 'dd.MM.yyyy')}"></span>
            </div>
        </a>
    </div>
</div>
</body>
</html>
