<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::.container})}">
<head>
    <title>Новая позиция меню</title>
</head>
<body>
<div class="container" th:fragment="content">
    <div class="card form-card">
        <h2>Новая позиция</h2>
        <form th:action="@{'/admin/restaurants/' + ${restaurantId} + '/menu/create'}" th:object="${menuItem}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label>Название</label>
                <input type="text" th:field="*{name}" required>
            </div>
            <div class="form-group">
                <label>Описание</label>
                <textarea th:field="*{description}" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Цена (₽)</label>
                <input type="number" step="0.01" th:field="*{price}" required>
            </div>
            <div class="form-group">
                <label>Вес (г)</label>
                <input type="number" th:field="*{weightGrams}">
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" th:field="*{isAlcoholic}" style="width:auto; margin-right:8px;">
                    Алкогольный напиток
                </label>
            </div>
            <div class="form-group">
                <label>Крепость (%)</label>
                <input type="number" step="0.1" th:field="*{alcoholPercentage}">
            </div>
            <div class="form-group">
                <label>Фото</label>
                <input type="file" name="photo" accept="image/*">
            </div>
            <button type="submit" class="btn">Сохранить</button>
            <a th:href="@{'/admin/restaurants/' + ${restaurantId} + '/menu'}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
</body>
</html>
