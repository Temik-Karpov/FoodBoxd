<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::.container})}">
<head>
    <title>Меню</title>
</head>
<body>
<div class="container" th:fragment="content">
    <h2>Меню ресторана</h2>
    <a th:href="@{'/admin/restaurants/' + ${restaurantId} + '/menu/create'}" class="btn">Добавить позицию</a>
    <div th:each="item : ${menu}" class="card">
        <h3 th:text="${item.name}"></h3>
        <span th:text="${'Цена: ' + item.price}"></span>
        <span th:if="${item.isAlcoholic}" th:text="${'Крепость: ' + item.alcoholPercentage + '%'}"></span>
        <!-- кнопки редактирования/скрытия (можно добавить) -->
    </div>
</div>
</body>
</html>
