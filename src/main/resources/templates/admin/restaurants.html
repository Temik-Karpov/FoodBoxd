<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::.container})}">
<head>
    <title>Управление ресторанами</title>
</head>
<body>
<div class="container" th:fragment="content">
    <div class="admin-bar">
        <h2 style="margin:0; flex:1;">Рестораны</h2>
        <a th:href="@{/admin/restaurants/create}" class="btn btn-sm">
            <i class="fas fa-plus"></i> Добавить ресторан
        </a>
    </div>

    <div th:if="${restaurants.isEmpty()}" class="card">
        <p class="empty-state">
            <i class="fas fa-utensils"></i>
            Ресторанов пока нет.
        </p>
    </div>

    <div th:each="r : ${restaurants}" class="card">
        <h3 th:text="${r.name}"></h3>
        <p style="color: var(--text-muted); margin: 6px 0 14px;" th:text="${r.address}"></p>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <a th:href="@{'/admin/restaurants/' + ${r.id} + '/edit'}" class="btn btn-sm">Редактировать</a>
            <a th:href="@{'/admin/restaurants/' + ${r.id} + '/menu'}" class="btn btn-sm btn-secondary">Меню</a>
            <form th:action="@{'/admin/restaurants/' + ${r.id} + '/deactivate'}" method="post">
                <button type="submit" class="btn btn-sm btn-secondary"
                        onclick="return confirm('Деактивировать ресторан?')">Деактивировать</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
