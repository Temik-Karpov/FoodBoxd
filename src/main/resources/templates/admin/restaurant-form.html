<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::.container})}">
<head>
    <title th:text="${restaurantId == null ? 'Новый ресторан' : 'Редактирование ресторана'}"></title>
</head>
<body>
<div class="container" th:fragment="content">
    <div class="card form-card">
        <h2 th:text="${restaurantId == null ? 'Новый ресторан' : 'Редактирование'}"></h2>
        <form th:action="@{${restaurantId == null ? '/admin/restaurants/create' : '/admin/restaurants/' + restaurantId + '/edit'}}" th:object="${restaurant}" method="post">
            <div class="form-group">
                <label>Название</label>
                <input type="text" th:field="*{name}" placeholder="Название заведения" required>
            </div>
            <div class="form-group">
                <label>Адрес</label>
                <input type="text" th:field="*{address}" placeholder="Город, улица, дом">
            </div>
            <div class="form-group">
                <label>Описание</label>
                <textarea th:field="*{description}" rows="4" placeholder="Кухня, атмосфера, фишки заведения..."></textarea>
            </div>
            <button type="submit" class="btn">Сохранить</button>
            <a th:href="@{/admin/restaurants}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
</body>
</html>
