<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title} ?: 'Foodboxd'">Foodboxd</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<!-- Декоративные фоновые пятна -->
<div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<nav>
    <a th:href="@{/}" class="logo">
        <span class="logo-icon"><i class="fas fa-utensils"></i></span>
        Foodboxd
    </a>

    <a th:href="@{/}" class="nav-link">Главная</a>
    <a sec:authorize="isAuthenticated()" th:href="@{/feed}" class="nav-link">Лента</a>
    <a sec:authorize="isAuthenticated()" th:href="@{/lists}" class="nav-link">Списки</a>
    <a sec:authorize="isAuthenticated()" th:href="@{/users}" class="nav-link">Пользователи</a>

    <div class="nav-spacer"></div>

    <!-- Выпадающее меню пользователя (для авторизованных) -->
    <div sec:authorize="isAuthenticated()" class="user-dropdown">
        <button class="user-dropdown-btn" onclick="this.parentElement.classList.toggle('open')">
            <img th:src="${currentUserAvatar}" alt="Аватар" class="nav-avatar">
            <i class="fas fa-chevron-down"></i>
        </button>
        <div class="user-dropdown-menu">
            <a th:href="@{/profile/{email}(email=${#authentication.name})}">
                <i class="fas fa-user"></i> Профиль
            </a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/restaurants}">
                <i class="fas fa-cog"></i> Админ-панель
            </a>
            <hr>
            <form th:action="@{/logout}" method="post">
                <button type="submit">
                    <i class="fas fa-sign-out-alt"></i> Выйти
                </button>
            </form>
        </div>
    </div>

    <!-- Кнопки для неавторизованных -->
    <div sec:authorize="!isAuthenticated()" class="nav-auth-buttons">
        <a th:href="@{/login}" class="btn btn-sm">Войти</a>
        <a th:href="@{/register}" class="btn btn-sm btn-secondary">Регистрация</a>
    </div>
</nav>

<main class="container">
    <th:block th:replace="${content}"></th:block>
</main>

<footer class="page-footer">
    <span>Foodboxd</span>
    <i class="fas fa-star"></i>
    <span>Рейтинги ресторанов и баров</span>
</footer>

<script>
    document.addEventListener('click', function(e) {
        document.querySelectorAll('.user-dropdown.open').forEach(dropdown => {
            if (!dropdown.contains(e.target)) {
                dropdown.classList.remove('open');
            }
        });
    });
</script>
</body>
</html>
